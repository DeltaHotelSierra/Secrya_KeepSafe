<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secrya KeepSafe</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🔐 Secrya KeepSafe</h1>
            <p class="subtitle">Email Phishing Analysis</p>
        </header>

        <!-- Auth Section -->
        <div id="authSection" class="section hidden">
            <h2>Connect Gmail</h2>
            <p>Authenticate with your Gmail account to analyze emails for phishing.</p>
            <button id="loginBtn" class="btn btn-primary">Login with Google</button>
            <div id="authError" class="error hidden"></div>
        </div>

        <!-- Main Section -->
        <div id="mainSection" class="section hidden">
            <div class="user-info">
                <span id="userEmail"></span>
                <button id="logoutBtn" class="btn btn-small btn-secondary">Logout</button>
            </div>

            <!-- Email Selection -->
            <div class="email-selector">
                <h3>Your Emails</h3>
                <div id="emailList" class="email-list">
                    <div class="loading">Loading emails...</div>
                </div>
                <button id="refreshBtn" class="btn btn-small">Refresh</button>
            </div>

            <!-- Analysis Result -->
            <div id="analysisResult" class="analysis-result hidden">
                <h3>Analysis Result</h3>
                <div id="riskBadge" class="risk-badge"></div>
                <div id="resultDetails"></div>
                <button id="closeResultBtn" class="btn btn-small">Back</button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
            <p>Analyzing email...</p>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
